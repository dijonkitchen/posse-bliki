name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; rustup on the runner installs it.
      - name: Install the pinned Rust toolchain
        run: make setup

      - name: Run CI (mirrors `make ci` locally)
        run: make ci

  lighthouse:
    # Lighthouse budget on the built pages (ADR 0013, spec/performance.md).
    # CI-only: it needs Node and Chrome, so it stays out of `make ci` and
    # the build. The runner image ships Chrome.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lighthouse budget (mirrors `make lighthouse` locally)
        run: make lighthouse

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: _lighthouse/*.json
