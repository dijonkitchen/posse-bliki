# Keeps the commit-pinned GitHub Actions current (ADR 2026-10-14-supply-chain-pinned-actions). Cargo is not
# listed: the build has no crates to update (ADR 2026-10-06-rust-build-zero-dependencies).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Let a release age a week before proposing it, so a hijacked tag is
    # likely caught and pulled upstream first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
