name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; rustup on the runner installs it.
      - name: Install the pinned Rust toolchain
        run: make setup

      - name: Run CI (mirrors `make ci` locally)
        run: make ci

  html:
    # Independent check of the built pages with the W3C Nu HTML Checker
    # (ADR 2026-10-11-nu-html-checker-in-ci). CI-only: it needs Java and a
    # download, so it stays out of `make ci` and the build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: make setup

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate the built site (mirrors `make validate` locally)
        run: make validate

  lighthouse:
    # Lighthouse budget on the built pages (ADR 2026-10-14-mobile-first, spec/performance.md).
    # CI-only: it needs Node and Chrome, so it stays out of `make ci` and
    # the build. The runner image ships Chrome.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: make setup

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Lighthouse budget (mirrors `make lighthouse` locally)
        run: make lighthouse

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: _lighthouse/*.json
