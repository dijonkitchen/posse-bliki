name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; rustup on the runner installs it.
      - name: Install the pinned Rust toolchain
        run: make setup

      - name: Run CI (mirrors `make ci` locally)
        run: make ci
