name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so newly received webmentions show up without a push.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Least privilege: the build job runs repository code, so it only reads.
# Only the deploy job, which runs no repository code, can publish (ADR 0016).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; rustup on the runner installs it.
      - name: Install the pinned Rust toolchain
        run: make setup

      # Build for the address Pages serves from: the project sub-path
      # (https://dijonkitchen.github.io/posse-bliki/) now, the bare custom
      # domain after cutover.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Received webmentions, rendered into the posts at build time (no JS).
      # Needs the WEBMENTION_IO_TOKEN secret (webmention.io > Settings > API
      # key); without it, or if webmention.io is down, posts show none.
      - name: Fetch received webmentions
        env:
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
        run: |
          if [ -z "$WEBMENTION_IO_TOKEN" ]; then
            echo "WEBMENTION_IO_TOKEN not set; building without webmentions"
          elif curl -sS --fail --max-time 60 -o "$RUNNER_TEMP/webmentions.json" \
              "https://webmention.io/api/mentions.jf2?per-page=10000&token=$WEBMENTION_IO_TOKEN"; then
            echo "WEBMENTIONS=$RUNNER_TEMP/webmentions.json" >> "$GITHUB_ENV"
          else
            echo "::warning::could not fetch webmentions; building without them"
          fi

      # The feed currently live, so the send step below can tell which posts
      # this deploy adds.
      - name: Fetch the deployed feed
        run: |
          curl -sS --fail --max-time 60 -o "$RUNNER_TEMP/previous-feed.json" \
            "${{ steps.pages.outputs.base_url }}/feed.json" \
            || echo "::warning::no deployed feed; nothing will be syndicated this run"

      - name: Run CI gate + build (mirrors `make ci` locally)
        run: make ci BASE_URL="${{ steps.pages.outputs.base_url }}" WEBMENTIONS="${WEBMENTIONS:-}"

      - name: List webmentions to send for new posts
        run: |
          : > pending-webmentions.tsv
          if [ -s "$RUNNER_TEMP/previous-feed.json" ]; then
            target/release/bliki --out public --pending-webmentions "$RUNNER_TEMP/previous-feed.json" \
              > pending-webmentions.tsv \
              || { echo "::warning::not syndicating this run"; : > pending-webmentions.tsv; }
          fi
          cat pending-webmentions.tsv

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pending-webmentions
          path: pending-webmentions.tsv

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # POSSE: once the new posts are live, ask Bridgy Publish (Mastodon,
  # Bluesky) and Bridgy Fed (fediverse) to syndicate them. Off until the
  # SEND_WEBMENTIONS repository variable is "true", which only makes sense
  # once the site is on its own domain and the Bridgy accounts are set up.
  syndicate:
    needs: deploy
    if: vars.SEND_WEBMENTIONS == 'true'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pending-webmentions

      - name: Send webmentions
        run: |
          failed=0
          while IFS="$(printf '\t')" read -r endpoint source target; do
            [ -n "$endpoint" ] || continue
            echo "-> $target for $source"
            curl -sS --fail-with-body --max-time 120 \
              --data-urlencode "source=$source" --data-urlencode "target=$target" "$endpoint" \
              || { echo "::warning::$target refused $source"; failed=1; }
            echo
          done < pending-webmentions.tsv
          exit $failed
