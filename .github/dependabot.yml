# Keeps the commit-pinned GitHub Actions current (ADR 2026-10-14-supply-chain-pinned-actions), the
# pinned Rust toolchain (ADR 2026-10-23-dependabot-rust-toolchain) and the
# CI-only Lighthouse (ADR 2026-11-05-dependabot-lighthouse-updates) and Nu HTML
# Checker (ADR 2026-11-06-dependabot-nu-checker). Cargo is not
# listed: the build has no crates to update (ADR 2026-10-06-rust-build-zero-dependencies).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Let a release age a week before proposing it, so a hijacked tag is
    # likely caught and pulled upstream first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /scripts/lighthouse
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /scripts/vnu
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
