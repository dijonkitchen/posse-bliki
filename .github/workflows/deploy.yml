name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run CI gate + build (mirrors `make ci` locally)
        run: make ci

      - id: pages
        uses: actions/configure-pages@v5

      # Point links at the address Pages serves from: the project sub-path
      # (https://dijonkitchen.github.io/posse-bliki/) now, the bare custom
      # domain after cutover.
      - name: Relocate site to the Pages URL
        run: python3 scripts/relocate.py public --to "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
