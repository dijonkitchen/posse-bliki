[package]
name = "posse-bliki-build"
version = "0.1.0"
edition = "2021"
description = "Static site build for posse-bliki (Rust std only; see docs/adr/0007)."
publish = false

# Deliberately empty: the build uses the Rust standard library only.
[dependencies]

[[bin]]
name = "bliki"
path = "build/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
