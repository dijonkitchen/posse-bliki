name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run CI (mirrors `make ci` locally)
        run: make ci

  html:
    # Independent check of the built pages with the W3C Nu HTML Checker
    # (ADR 0011). CI-only: it needs Java and a download, so it stays out of
    # `make ci` and the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate the built site (mirrors `make validate` locally)
        run: make validate
