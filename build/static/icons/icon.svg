<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Site icon: the spork from JC's Substack, redrawn as one bold silhouette
    so it reads at 16px and from across a room: a round spoon tip with three
    short tines split by two wide slots, a narrow neck and a handle that
    widens to a rounded end, at the picture's slant. Ink on light tabs, paper on dark ones
    (spec/performance.md).
  -->
  <style>
    .spork { fill: #1e232c; }
    @media (prefers-color-scheme: dark) {
      .spork { fill: #fbfaf7; }
    }
  </style>
  <defs>
    <!-- The two slots between the three tines. -->
    <mask id="tines">
      <rect x="-50" y="-10" width="100" height="120" fill="#fff"/>
      <rect x="-9" y="-3" width="6" height="19" rx="3" transform="rotate(-6 -6 16)" fill="#000"/>
      <rect x="3" y="-3" width="6" height="19" rx="3" transform="rotate(6 6 16)" fill="#000"/>
    </mask>
  </defs>
  <!-- Drawn upright, 100 units long, then tilted 33° like the picture. -->
  <g class="spork" transform="translate(15.3 16.2) rotate(33) scale(0.335) translate(0 -50)">
    <path mask="url(#tines)" d="M0 0 C10 0 16.5 7 16.5 17 C16.5 26 14 33 10 39 C7.5 43 5 47 3.5 52 H-3.5 C-5 47 -7.5 43 -10 39 C-14 33 -16.5 26 -16.5 17 C-16.5 7 -10 0 0 0 Z"/>
    <path d="M-3 48 H3 L5.5 95 Q5.5 100 1.5 100 H-1.5 Q-5.5 100 -5.5 95 Z"/>
  </g>
</svg>
