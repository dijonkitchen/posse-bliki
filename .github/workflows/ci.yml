name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; rustup on the runner installs it.
      - name: Install the pinned Rust toolchain
        run: make setup

      - name: Run CI (mirrors `make ci` locally)
        run: make ci

  html:
    # Independent check of the built pages with the W3C Nu HTML Checker
    # (ADR 2026-10-11-nu-html-checker-in-ci). CI-only: it needs Java and a
    # download, so it stays out of `make ci` and the build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: make setup

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate the built site (mirrors `make validate` locally)
        run: make validate

  lighthouse:
    # Lighthouse budget on the built pages (ADR 2026-10-14-mobile-first, spec/performance.md).
    # CI-only: it needs Node and Chrome, so it stays out of `make ci` and
    # the build. The runner image ships Chrome.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: make setup

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Lighthouse budget (mirrors `make lighthouse` locally)
        run: make lighthouse

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse-reports
          path: _lighthouse/*.json
